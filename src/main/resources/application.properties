spring.application.name=career-platform

# =========================
# AI
# =========================

# AI is opt-in.
# Without AI configuration, the traditional application must still start normally.
# AI_CHAT_ENABLED is the maintained global switch. Keep the M6A name as a
# temporary fallback so existing local environments continue to work.
career-platform.ai.enabled=${AI_CHAT_ENABLED:${AI_JD_PARSE_ENABLED:false}}

# DeepSeek uses an OpenAI-compatible API, so Spring AI uses the "openai" adapter.
career-platform.ai.provider=${AI_CHAT_PROVIDER:none}

# Real API key comes only from the local environment.
career-platform.ai.api-key=${AI_API_KEY:}

# Enable/disable Spring AI chat model auto-configuration.
# Runtime value should be "openai" when DeepSeek AI is enabled.
spring.ai.model.chat=${AI_CHAT_PROVIDER:none}

# Other AI model types are not used in M6A.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.transcription=none
spring.ai.model.audio.speech=none
spring.ai.model.moderation=none

# We currently create/manage ChatClient through the application AI gateway.
spring.ai.chat.client.enabled=false

# A non-secret sentinel allows configuration to exist without committing a real key.
# The application AI gateway must still refuse actual calls unless AI_API_KEY is configured.
spring.ai.openai.api-key=${AI_API_KEY:not-configured}

# DeepSeek official OpenAI-compatible endpoint.
spring.ai.openai.base-url=https://api.deepseek.com

# HARD LOCK: this project only uses DeepSeek V4 Flash.
# Do NOT expose model selection to frontend/request/environment variables.
spring.ai.openai.chat.options.model=deepseek-v4-flash

# M6C search is opt-in; its endpoint and model are fixed in the dedicated gateway.
career-platform.job-search.enabled=${TAVILY_SEARCH_ENABLED:false}
career-platform.job-search.api-key=${TAVILY_API_KEY:}


# =========================
# Database
# =========================

spring.datasource.url=jdbc:mysql://localhost:3306/career_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
